<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!--Заголовок для кожної сторінки буде різним-->
  <title>{% block title %} {% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
</head>
<body>

  <!--Шапка спільна для всіх сторінок-->
  <header>
    <nav class="navbar bg-dark mb-4" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('product.products') }}">
          <img src="{{ url_for('static', filename='image/logo.png') }}" style="filter: invert(100%)"
               alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
          <span class="navbar-brand m-1 h1">Product Manager</span>
        </a>

        <!--Кнопки-->
        <div>
          <a href="{{ url_for('auth.login') }}" class="btn btn-light" role="button">Login</a>
          <a href="{{ url_for('auth.register') }}" class="btn btn-outline-light" role="button">Register</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">

      <!--Flash-повідомлення є на всіх сторінках-->
      {% with messages = get_flashed_messages() %}
        {% for msg in messages %}
          <div class="alert alert-info" role="alert">
            {{ msg }}
          </div>
        {% endfor %}
      {% endwith %}

      <!--Тут буде унікальний контент кожної сторінки-->
      {% block content %}
      {% endblock %}

    </div>
  </main>
</body>
</html>
